<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLEASAND</title>
<meta name="description" content="a falling sand game, with peasants in it. pour things, light things, throw peasants. they have names.">
<link rel="icon" href="favicon.gif" type="image/gif">
<style>
html, body { margin:0; height:100%; background:#05070c; overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; }
#stage { position:relative; isolation:isolate; width:min(100vw, 156.1vh); height:min(64.06vw, 100vh); }
#stage canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
#cv { cursor:crosshair; touch-action:none; }
/* the field on the GPU, and the bangs added onto it (glr.ts): shown once there is WebGL2 to draw them with */
#gl, #fx { visibility:hidden; pointer-events:none; }
#fx { mix-blend-mode:plus-lighter; }
#vig { pointer-events:none; }
</style>
</head>
<body>
<div id="stage">
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<canvas id="cv" width="640" height="410"></canvas>
<canvas id="vig"></canvas>
</div>
<!-- the game, in the order it loads. one scope: vite.config.mts joins them into one module for the browser, and
     harness/loader.js does the same for node -->
<script src="rng.ts"></script>
<script src="audio.ts"></script>
<script src="world.ts"></script>
<script src="heat.ts"></script>
<script src="simwasm-bin.js"></script>
<script src="simwasm.ts"></script>
<script src="peasants.ts"></script>
<script src="build.ts"></script>
<script src="paths.ts"></script>
<script src="ideas.ts"></script>
<script src="mines.ts"></script>
<script src="oil.ts"></script>
<script src="leftovers.ts"></script>
<script src="tidy.ts"></script>
<script src="wonders.ts"></script>
<script src="monuments.ts"></script>
<script src="pleasures.ts"></script>
<script src="heavens.ts"></script>
<script src="storeys.ts"></script>
<script src="platforms.ts"></script>
<script src="ducks.ts"></script>
<script src="hand.ts"></script>
<script src="save.ts"></script>
<script src="glr.ts"></script>
<script src="game.ts"></script>
</body>
</html>
