<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLEASAND</title>
<meta name="description" content="a falling sand game, with peasants in it. pour things, light things, throw peasants. they have names.">
<link rel="icon" href="favicon.gif" type="image/gif">
<style>
html, body { margin:0; height:100%; background:#05070c; overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; }
#stage { position:relative; isolation:isolate; width:min(100vw, 156.1vh); height:min(64.06vw, 100vh); }
#stage canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
#cv { cursor:crosshair; touch-action:none; }
/* the field on the GPU, and the bangs added onto it (glr.js): shown once there is WebGL2 to draw them with */
#gl, #fx { visibility:hidden; pointer-events:none; }
#fx { mix-blend-mode:plus-lighter; }
#vig { pointer-events:none; }
</style>
</head>
<body>
<div id="stage">
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<canvas id="cv" width="640" height="410"></canvas>
<canvas id="vig"></canvas>
</div>
<script src="rng.js"></script>
<script src="audio.js"></script>
<script src="world.js"></script>
<script src="heat.js"></script>
<script src="simwasm-bin.js"></script>
<script src="simwasm.js"></script>
<script src="peasants.js"></script>
<script src="build.js"></script>
<script src="paths.js"></script>
<script src="ideas.js"></script>
<script src="mines.js"></script>
<script src="oil.js"></script>
<script src="leftovers.js"></script>
<script src="tidy.js"></script>
<script src="wonders.js"></script>
<script src="monuments.js"></script>
<script src="pleasures.js"></script>
<script src="heavens.js"></script>
<script src="storeys.js"></script>
<script src="platforms.js"></script>
<script src="ducks.js"></script>
<script src="hand.js"></script>
<script src="save.js"></script>
<script src="glr.js"></script>
<script src="game.js"></script>
</body>
</html>
