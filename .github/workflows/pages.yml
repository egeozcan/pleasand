name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the sand and heat steps, as WebAssembly (wasm/): the toolchain is the one wasm/rust-toolchain.toml names
      - name: Build the WebAssembly step
        run: |
          (cd wasm && rustup toolchain install)
          wasm/build.sh
      # the module must play the very world the JS does, or it does not go out
      - name: Check the WebAssembly step against the JS
        run: |
          node test/run.js wasm
          node test/run.js heat:
          node test/run.js shortcuts
      - name: Check the types
        run: npm run typecheck
      # the scripts, joined into one module (vite.config.mts), with the WebAssembly in it ("AGFzbQ": "\0asm", base64)
      - name: Build the site
        run: |
          npm run build
          grep -q AGFzbQ dist/assets/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
